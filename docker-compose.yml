# RabbitMQ's four exchange types, end to end.
#
#   producer ──► orders.direct       (direct)  ──► orders.create
#            ──► notifications.topic (topic)   ──► notifications.email, notifications.sms
#            ──► broadcast.fanout    (fanout)  ──► all 5 queues
#            ──► orders.headers      (headers) ──► orders.match-all, orders.match-any
#
# The producer publishes only to exchanges. Each consumer declares the
# 4 exchanges, the 5 queues and their bindings (consumer/src/core/rabbit/
# rabbit.schema.ts). Both consumers run the same image and read the same
# queues, so they compete: each message in a queue is handled by only one.
#
#   docker compose up -d --build
#   docker compose logs -f consumer-1 consumer-2   # which queue and exchange each message came through
#   http://localhost:3000/docs                     # the producer's endpoints, one per exchange
#   http://localhost:15672                         # exchanges, queues and bindings (guest / guest)
#
# Each service can also be started on its own, e.g. `docker compose up -d
# rabbitmq` and then the apps with `npm run start:dev`.

name: event-driven

x-rabbit-environment: &rabbit-environment
  RABBIT_URL: amqp://guest:guest@rabbitmq:5672

x-consumer: &consumer
  build: ./consumer
  image: event-driven-consumer
  environment:
    <<: *rabbit-environment
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    # RabbitMQ names its data after the node, and the node after the host, so
    # a fixed hostname keeps the same queues and messages across restarts.
    hostname: rabbitmq
    ports:
      - "5672:5672"   # AMQP, the port every .env expects
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Two instances of the same application. Add a third by copying one of these
  # two lines: it declares the same queues and joins the competition.
  consumer-1: *consumer
  consumer-2: *consumer

  producer:
    build: ./producer
    environment:
      <<: *rabbit-environment
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
